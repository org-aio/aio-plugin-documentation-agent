<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="aio-page-id" content="menu-31" />
    <meta name="aio-route" content="/boxun/commission-order" />
    <link rel="icon" href="../logo.svg" />
    <title>委托单管理</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #f5f7f9;
      }

      .app-bootstrap-loading {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
        color: #606266;
        background: #f5f7f9;
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
      }

      .app-bootstrap-loading__status {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .app-bootstrap-loading__error {
        display: none;
        max-width: 420px;
        text-align: center;
      }

      .app-bootstrap-loading__error button {
        margin-top: 12px;
        padding: 6px 14px;
        border: 1px solid #409eff;
        border-radius: 6px;
        color: #409eff;
        background: transparent;
        cursor: pointer;
      }

      .app-bootstrap-loading.is-error .app-bootstrap-loading__status {
        display: none;
      }

      .app-bootstrap-loading.is-error .app-bootstrap-loading__error {
        display: block;
      }

      .app-bootstrap-loading__spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #c8d3df;
        border-top-color: #409eff;
        border-radius: 50%;
        animation: app-bootstrap-spin 0.8s linear infinite;
      }

      @keyframes app-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: dark) {
        body,
        .app-bootstrap-loading {
          color: #a8abb2;
          background: #101418;
        }

        .app-bootstrap-loading__spinner {
          border-color: #3f4a56;
          border-top-color: #409eff;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-bootstrap-loading__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-bootstrap-loading" role="status" aria-live="polite">
        <div class="app-bootstrap-loading__status">
          <span class="app-bootstrap-loading__spinner" aria-hidden="true"></span>
          <span>正在加载页面</span>
        </div>
        <div class="app-bootstrap-loading__error">
          <div>页面加载超时，请检查网络后重试。</div>
          <button type="button" onclick="location.reload()">重新加载</button>
        </div>
      </div>
    </div>
    <script>
      window.__aioBootstrapTimer = window.setTimeout(function () {
        var loading = document.querySelector('.app-bootstrap-loading')
        if (loading) {
          loading.classList.add('is-error')
        }
      }, 30000)
    </script>
    <script>
      window.addEventListener(
        'error',
        function (event) {
          var loading = document.querySelector('.app-bootstrap-loading')
          if (loading && event.target && event.target.tagName === 'SCRIPT') {
            window.__aioBootstrapTimer && window.clearTimeout(window.__aioBootstrapTimer)
            loading.classList.add('is-error')
          }
        },
        true
      )
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
