[package]
name = "boxun-topcoat-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.22"
bcrypt = "0.17"
calamine = { version = "0.31", features = ["dates"] }
encoding_rs = "0.8"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
pinyin = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rust_xlsxwriter = "0.90"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-chrono-0_4", "with-uuid-1"] }
topcoat = { version = "0.6.2", default-features = false, features = ["discover", "router", "serve", "view", "mail-smtp"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
